name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  backend-test:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: chardworkz
          POSTGRES_USER: chardworkz
          POSTGRES_PASSWORD: chardworkz_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: mvn test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: chardworkz
          DB_USER: chardworkz
          DB_PASSWORD: chardworkz_ci
          JWT_SECRET: ci-only-dummy-secret-never-used-outside-this-workflow-32b
        run: |
          chmod +x mvnw
          ./mvnw test -B

  frontend-build:
    name: Frontend (ng build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ng build
        run: npx ng build
