<div class="space-y-4">
  <div>
    <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">Activity History</h1>
    <p class="mt-1 text-sm font-normal text-gray-500 dark:text-gray-400">
      Recent sales and stock receipts, most recent first.
    </p>
  </div>

  <div class="dashboard-card">
    <div class="space-y-2">
      <div
        *ngFor="let item of activities()"
        class="flex items-center justify-between gap-3 rounded-xl bg-nav-bg p-3 dark:bg-slate-700/50"
      >
        <div class="min-w-0">
          <p class="truncate text-sm font-medium text-gray-900 dark:text-gray-100">
            {{ item.title }}
          </p>
          <p class="truncate text-xs font-normal text-gray-500 dark:text-gray-400">
            {{ item.subtitle }}
          </p>
        </div>
        <p class="shrink-0 text-xs font-normal text-gray-400 dark:text-gray-500">
          {{ item.occurredAt | date: 'MMM d, y, h:mm a' }}
        </p>
      </div>

      <p
        *ngIf="activities().length === 0"
        class="py-6 text-center text-sm font-normal text-gray-500 dark:text-gray-400"
      >
        No activity yet.
      </p>
    </div>
  </div>
</div>
