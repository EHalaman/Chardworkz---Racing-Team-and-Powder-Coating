<div class="relative mt-1">
  <input
    [id]="id"
    [name]="name"
    [attr.autocomplete]="autocomplete"
    [required]="required"
    [type]="show() ? 'text' : 'password'"
    [value]="value"
    (input)="onInput($any($event.target).value)"
    class="w-full rounded-lg border border-gray-300 bg-surface px-3 py-2 pr-10 text-sm text-gray-900 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary dark:border-slate-600 dark:bg-slate-800 dark:text-gray-100"
  />
  <button
    type="button"
    (click)="toggleShow()"
    [attr.aria-label]="show() ? 'Hide password' : 'Show password'"
    [attr.aria-pressed]="show()"
    class="absolute inset-y-0 right-0 flex w-10 items-center justify-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
  >
    <svg
      *ngIf="!show()"
      class="h-4 w-4"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
      <circle cx="12" cy="12" r="3" />
    </svg>
    <svg
      *ngIf="show()"
      class="h-4 w-4"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M3 3l18 18" />
      <path
        d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a15.6 15.6 0 0 1-3.1 4M6.6 6.6C4 8.3 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4.2-.9"
      />
      <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
    </svg>
  </button>
</div>
