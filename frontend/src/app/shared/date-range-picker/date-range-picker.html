<div #wrapper class="relative inline-block">
  <button
    type="button"
    (click)="toggle()"
    class="flex items-center gap-2 rounded-lg border border-gray-300 bg-surface px-3 py-2 text-sm font-medium text-gray-900 transition-colors hover:bg-nav-bg focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary dark:border-slate-600 dark:bg-slate-800 dark:text-gray-100 dark:hover:bg-slate-700"
  >
    <span>{{ triggerLabel }}</span>
    <span aria-hidden="true">&#9662;</span>
  </button>

  <div
    *ngIf="isOpen()"
    class="absolute z-20 mt-2 flex overflow-hidden rounded-lg border border-gray-200 bg-surface shadow-lg dark:border-slate-700 dark:bg-slate-800"
  >
    <div class="flex flex-col gap-1 border-r border-gray-200 p-3 dark:border-slate-700">
      <button
        *ngFor="let preset of presets"
        type="button"
        (click)="applyPreset(preset.key)"
        [ngClass]="
          activePreset() === preset.key
            ? 'bg-primary text-white'
            : 'text-gray-700 hover:bg-nav-bg dark:text-gray-300 dark:hover:bg-slate-700'
        "
        class="whitespace-nowrap rounded-lg px-3 py-2 text-left text-sm font-medium transition-colors"
      >
        {{ preset.label }}
      </button>
    </div>

    <div class="p-3">
      <div class="mb-3 flex items-end gap-2">
        <div>
          <label class="text-xs font-medium text-gray-700 dark:text-gray-300">Start</label>
          <input
            type="date"
            [value]="startIso()"
            [max]="todayIso"
            (change)="onStartInput($any($event.target).value)"
            class="mt-1 block rounded-lg border border-gray-300 bg-surface px-2 py-1.5 text-sm text-gray-900 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary dark:border-slate-600 dark:bg-slate-800 dark:text-gray-100"
          />
        </div>
        <div>
          <label class="text-xs font-medium text-gray-700 dark:text-gray-300">End</label>
          <input
            type="date"
            [value]="endIso()"
            [max]="todayIso"
            (change)="onEndInput($any($event.target).value)"
            class="mt-1 block rounded-lg border border-gray-300 bg-surface px-2 py-1.5 text-sm text-gray-900 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary dark:border-slate-600 dark:bg-slate-800 dark:text-gray-100"
          />
        </div>
        <button
          type="button"
          (click)="goToToday()"
          class="mb-0.5 rounded-lg border border-gray-300 px-3 py-1.5 text-xs font-semibold uppercase tracking-wide text-gray-700 transition-colors hover:bg-nav-bg dark:border-slate-600 dark:text-gray-300 dark:hover:bg-slate-700"
        >
          Today
        </button>
      </div>

      <div class="flex gap-6">
        <div>
          <div class="mb-2 flex items-center justify-between">
            <button
              type="button"
              (click)="prevMonth()"
              class="rounded-lg px-2 py-1 text-gray-500 hover:bg-nav-bg dark:text-gray-400 dark:hover:bg-slate-700"
              aria-label="Previous month"
            >
              &#8249;
            </button>
            <span class="text-sm font-semibold text-gray-900 dark:text-gray-100">{{
              leftMonthLabel
            }}</span>
            <span class="w-7"></span>
          </div>
          <div class="grid grid-cols-7 gap-0.5 text-center text-xs">
            <span
              *ngFor="let label of weekdayLabels"
              class="py-1 font-medium text-gray-400 dark:text-gray-500"
              >{{ label }}</span
            >
            <button
              *ngFor="let day of leftDays; trackBy: trackByTime"
              type="button"
              [disabled]="isFutureDay(day.date)"
              (click)="selectDay(day.date)"
              (mouseenter)="onDayHover(day.date)"
              [ngClass]="{
                'text-gray-300 dark:text-gray-600': !day.inMonth,
                'text-gray-700 dark:text-gray-300': day.inMonth && !isFutureDay(day.date),
                'cursor-not-allowed opacity-40': isFutureDay(day.date),
                'bg-primary-light dark:bg-primary/20':
                  isInRange(day.date) && !isRangeStart(day.date) && !isRangeEnd(day.date),
                'bg-primary text-white hover:bg-primary':
                  isRangeStart(day.date) || isRangeEnd(day.date),
              }"
              class="rounded-lg py-1.5 text-sm transition-colors hover:bg-nav-bg dark:hover:bg-slate-700"
            >
              {{ day.date.getDate() }}
            </button>
          </div>
        </div>

        <div>
          <div class="mb-2 flex items-center justify-between">
            <span class="w-7"></span>
            <span class="text-sm font-semibold text-gray-900 dark:text-gray-100">{{
              rightMonthLabel
            }}</span>
            <button
              type="button"
              (click)="nextMonth()"
              class="rounded-lg px-2 py-1 text-gray-500 hover:bg-nav-bg dark:text-gray-400 dark:hover:bg-slate-700"
              aria-label="Next month"
            >
              &#8250;
            </button>
          </div>
          <div class="grid grid-cols-7 gap-0.5 text-center text-xs">
            <span
              *ngFor="let label of weekdayLabels"
              class="py-1 font-medium text-gray-400 dark:text-gray-500"
              >{{ label }}</span
            >
            <button
              *ngFor="let day of rightDays; trackBy: trackByTime"
              type="button"
              [disabled]="isFutureDay(day.date)"
              (click)="selectDay(day.date)"
              (mouseenter)="onDayHover(day.date)"
              [ngClass]="{
                'text-gray-300 dark:text-gray-600': !day.inMonth,
                'text-gray-700 dark:text-gray-300': day.inMonth && !isFutureDay(day.date),
                'cursor-not-allowed opacity-40': isFutureDay(day.date),
                'bg-primary-light dark:bg-primary/20':
                  isInRange(day.date) && !isRangeStart(day.date) && !isRangeEnd(day.date),
                'bg-primary text-white hover:bg-primary':
                  isRangeStart(day.date) || isRangeEnd(day.date),
              }"
              class="rounded-lg py-1.5 text-sm transition-colors hover:bg-nav-bg dark:hover:bg-slate-700"
            >
              {{ day.date.getDate() }}
            </button>
          </div>
        </div>
      </div>

      <div class="mt-3 flex justify-end">
        <button
          type="button"
          (click)="close()"
          class="rounded-lg bg-primary px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-primary-hover"
        >
          Done
        </button>
      </div>
    </div>
  </div>
</div>
