<div class="flex min-h-screen items-center justify-center bg-nav-bg px-4 dark:bg-slate-900">
  <div class="w-full max-w-sm">
    <div class="mb-6 flex flex-col items-center gap-2">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-lg bg-primary text-base font-bold text-white"
      >
        C
      </div>
      <span class="text-sm font-semibold text-gray-900 dark:text-gray-100">ChardWorkz</span>
    </div>

    <form
      class="dashboard-card space-y-4"
      (submit)="$event.preventDefault(); onSubmit(username.value, password.value)"
    >
      <div>
        <h1 class="text-xl font-bold text-gray-900 dark:text-gray-100">Sign in</h1>
        <p class="mt-1 text-sm font-normal text-gray-500 dark:text-gray-400">
          Use your ChardWorkz staff account.
        </p>
      </div>

      <div
        *ngIf="errorMessage()"
        class="rounded-lg bg-danger-light px-3 py-2 text-sm font-medium text-danger dark:bg-danger/20"
      >
        {{ errorMessage() }}
      </div>

      <div>
        <label for="username" class="text-sm font-medium text-gray-700 dark:text-gray-300"
          >Username</label
        >
        <input
          #username
          id="username"
          name="username"
          type="text"
          required
          autocomplete="username"
          class="mt-1 w-full rounded-lg border border-gray-300 bg-surface px-3 py-2 text-sm text-gray-900 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary dark:border-slate-600 dark:bg-slate-800 dark:text-gray-100"
        />
      </div>

      <div>
        <label for="password" class="text-sm font-medium text-gray-700 dark:text-gray-300"
          >Password</label
        >
        <app-password-input
          #password
          id="password"
          name="password"
          [required]="true"
          autocomplete="current-password"
        ></app-password-input>
      </div>

      <button
        type="submit"
        [disabled]="submitting()"
        class="w-full rounded-lg bg-primary px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-primary-hover disabled:opacity-60"
      >
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
