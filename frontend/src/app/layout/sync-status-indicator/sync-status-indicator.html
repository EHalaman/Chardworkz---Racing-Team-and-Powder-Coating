<button
  *ngIf="queue.failedCount() > 0"
  type="button"
  (click)="retry()"
  class="flex shrink-0 items-center gap-1.5 rounded-full bg-danger-light px-3 py-1.5 text-xs font-medium text-danger transition-colors hover:bg-danger/20 dark:bg-danger/20"
>
  {{ queue.failedCount() }} needs attention · Retry
</button>

<div
  *ngIf="queue.failedCount() === 0 && queue.pendingCount() > 0"
  class="flex shrink-0 items-center gap-1.5 rounded-full bg-secondary-light px-3 py-1.5 text-xs font-medium text-secondary-hover dark:bg-secondary/20 dark:text-secondary"
>
  {{ queue.pendingCount() }} syncing
</div>
