# Dev-only profile: in-memory H2, no real PostgreSQL needed.
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Never use this profile in production - it wipes data on every restart.
#
# Runs the SAME Flyway migrations (db/migration/) as the real PostgreSQL
# target, via H2's PostgreSQL compatibility mode - not a separate
# Hibernate-generated schema. This is the closest verification available in
# an environment with no local/Docker PostgreSQL; H2's PG-compat mode does
# not guarantee full parity, so still boot-test against real PostgreSQL
# before trusting this migration in production.

spring.datasource.url=jdbc:h2:mem:chardworkz;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=true

# Dev-only - a fresh random value, never used anywhere real. Production sets
# JWT_SECRET as an actual environment variable, never a value in a file.
app.jwt.secret=ijwwD16ZH/Bvc6c1+4zZtQSOt36dL3koZnzGFPiMYx7EU20k4KEkelfK3nwWraZg

# Dev-only bootstrap Owner login, so `local` boots with something to log in
# as. Never set real credentials here - production supplies these via
# BOOTSTRAP_OWNER_USERNAME / BOOTSTRAP_OWNER_PASSWORD env vars instead.
app.bootstrap-owner.username=owner
app.bootstrap-owner.password=dev-only-change-me
