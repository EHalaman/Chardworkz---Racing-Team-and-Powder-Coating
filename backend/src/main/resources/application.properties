spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chardworkz}
spring.datasource.username=${DB_USER:chardworkz}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Required - the app fails fast at startup if this is blank or under 32 bytes (see JwtService).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Bootstrap Owner account - created once, only if the account table is empty.
# Blank by default: a production boot without these set simply logs a warning
# and creates no account (see BootstrapAccountRunner), never a default login.
app.bootstrap-owner.username=${BOOTSTRAP_OWNER_USERNAME:}
app.bootstrap-owner.password=${BOOTSTRAP_OWNER_PASSWORD:}

# Blank by default (no cross-origin allowance) - only needed when the frontend
# is served from a different origin than this API, e.g. the Angular dev
# server during local development (see SecurityConfig).
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:}

# Without this, Spring Boot's default /error body omits the ResponseStatusException
# reason text entirely (e.g. "Username already taken"), leaving the client with
# just a generic {"status":400,"error":"Bad Request"}. Safe here: every reason
# string in this codebase is an author-written message, never a stack trace.
server.error.include-message=always

# Explicit ceiling for Inventory's Excel/CSV import upload - comfortably covers
# a realistically large catalog (a 20k-row .xlsx is typically well under 1MB)
# while bounding memory use against an oversized or malicious upload. See
# ApiExceptionHandler for the matching clean-error response.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
